parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Domain/Model/'
            - '../src/Kernel.php'

    App\Infrastructure\Reporting\ReportingClient:
        arguments:
            $baseUrl: '%env(REPORTING_BASE_URL)%'

    App\Domain\Repository\ActivityRepositoryInterface:
        alias: App\Infrastructure\Persistence\Doctrine\DoctrineActivityRepository

    App\Domain\Repository\ItineraryRepositoryInterface:
        alias: App\Infrastructure\Persistence\Doctrine\DoctrineItineraryRepository

    App\Domain\Repository\StudentRepositoryInterface:
        alias: App\Infrastructure\Persistence\Doctrine\DoctrineStudentRepository

    App\Domain\Repository\StudentProgressRepositoryInterface:
        alias: App\Infrastructure\Persistence\Doctrine\DoctrineStudentProgressRepository

when@test:
    services:
        App\Tests\Behat\:
            resource: '../tests/Behat/'
            autowire: true
            autoconfigure: true
