services:
  php:
    build:
      context: .
      dockerfile: apps/student-platform/backend/etc/docker/php/Dockerfile
    container_name: innovamat_php
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-debug,develop}
      XDEBUG_START_WITH_REQUEST: ${XDEBUG_START_WITH_REQUEST:-yes}
      XDEBUG_CLIENT_HOST: ${XDEBUG_CLIENT_HOST:-host.docker.internal}
      XDEBUG_CLIENT_PORT: ${XDEBUG_CLIENT_PORT:-9003}
      XDEBUG_IDEKEY: ${XDEBUG_IDEKEY:-VSCODE}
    volumes:
      - ./apps/student-platform/backend:/var/www
    networks:
      - innovamat
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.25-alpine
    container_name: innovamat_nginx
    ports:
      - "8080:80"
    volumes:
      - ./apps/student-platform/backend:/var/www
      - ./apps/student-platform/backend/etc/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - innovamat
    depends_on:
      - php

  mysql:
    image: mysql:8.0
    container_name: innovamat_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: innovamat
      MYSQL_USER: innovamat
      MYSQL_PASSWORD: innovamat
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - innovamat
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql_test:
    image: mysql:8.0
    container_name: innovamat_mysql_test
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: innovamat_test
      MYSQL_USER: innovamat
      MYSQL_PASSWORD: innovamat
    ports:
      - "3307:3306"
    networks:
      - innovamat
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    image: node:20-alpine
    container_name: innovamat_frontend
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./apps/student-platform/frontend:/app
    networks:
      - innovamat
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

networks:
  innovamat:
    driver: bridge

volumes:
  mysql_data:
